<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>Car Price Predictor</title>
</head>

<body class="bg-dark">

    <div class="container">
        <div class="row">

            <div class="card mt-50" style="width: 100%; height: 100%;">

                <div class="card-header">
                    <div class="col-12" style="text-align: center">
                        <h1>Welcome to Car Price Predictor</h1>
                    </div>
                </div>

                <div class="card-body">
                  <form method="post" action="#" accept-charset="utf-8">

                    <div class="col-10 form-group" style="text-align: center">
                      <label><b>Select Company: </b></label>
                      <select class="selectpicker form-control" id="company" name="company" required="1">
                        <option value="">

                        </option>
                      </select>
                    </div>

                    <div class="col-10 form-group" style="text-align: center">
                      <label><b>Select Model: </b></label>
                      <select class="selectpicker form-control" id="car_model" name="car_model" required="1">
                        <option value="">

                        </option>
                      </select>
                    </div>

                    <div class="col-10 form-group" style="text-align: center">
                      <label><b>Select Year of Purchase: </b></label>
                      <select class="selectpicker form-control" id="year" name="year" required="1">
                        <option value="">

                        </option>
                      </select>
                    </div>

                    <div class="col-10 form-group" style="text-align: center">
                      <label><b>Select Fuel Type: </b></label>
                      <select class="selectpicker form-control" id="fuel_type" name="fuel_type" required="1">
                        <option value="">

                        </option>
                      </select>
                    </div>

                    <div class="col-10 form-group" style="text-align: center">
                      <label><b>Enter number of Kilometers travelled: </b></label>
                      <input class="form-control" type="text" id="kilo_driven" name="kilo_driven" placeholder="Enter no. of Kilometers travelled">

                    </div>

                    <div class="col-10 form-group" style="text-align: center">
                      <button class="btn btn-primary form-control" onclick="">Predict Price</button>
                    </div>

                  </form>

                </div>

            </div>

        </div>
    </div>


    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>

</body>

</html>
